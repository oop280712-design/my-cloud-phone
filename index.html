<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueFinger - Cloud Phone Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">📱 Blue<span>Finger</span></div>
        <div id="userAccountInfo">Guest</div>
    </header>

    <div class="container">
        
        <!-- 1. หน้าสมัครสมาชิก -->
        <div class="card" id="registerCard">
            <h2>สมัครสมาชิก BlueFinger</h2>
            <form onsubmit="registerUser(event)">
                <div class="input-group">
                    <label>อีเมล (Google Email):</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>ชื่อผู้ใช้ (Username):</label>
                    <input type="text" id="regUsername" placeholder="ตั้งชื่อผู้ใช้งาน" required>
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน (Password):</label>
                    <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่าน" required>
                </div>
                <button type="submit" class="btn-blue">สมัครสมาชิก</button>
            </form>
        </div>

        <!-- 2. หน้าแจ้งเตือนสมัครสำเร็จ -->
        <div class="card" id="successCard" style="display: none;">
            <h2 style="color: #4ade80;">🎉 สมัครสมาชิกสำเร็จ!</h2>
            <p style="margin: 15px 0; color: #cbd5e1;">บัญชีของคุณถูกสร้างเรียบร้อยแล้ว กดปุ่มด้านล่างเพื่อเข้าสู่ระบบ</p>
            <button class="btn-blue" onclick="goToLogin()">ไปหน้าเข้าสู่ระบบ</button>
        </div>

        <!-- 3. หน้าเข้าสู่ระบบ -->
        <div class="card" id="loginCard" style="display: none;">
            <h2>เข้าสู่ระบบ BlueFinger</h2>
            <form onsubmit="loginUser(event)">
                <div class="input-group">
                    <label>อีเมล:</label>
                    <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน:</label>
                    <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน" required>
                </div>
                <button type="submit" class="btn-blue">เข้าสู่ระบบ</button>
            </form>
        </div>

        <!-- 4. หน้าเลือกแพ็กเกจ -->
        <div class="card" id="packageCard" style="display: none; max-width: 600px;">
            <h2>เลือกแพ็กเกจ Cloud Phone</h2>
            <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 20px;">เลือกสเปกเครื่องที่เหมาะสมกับการใช้งานของคุณ</p>
            <div id="packageList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <!-- 5. หน้า Dashboard คลาวด์โฟนสไตล์ RedFinger -->
        <div id="cloudDashboard" style="display: none;">
            <div class="redfinger-layout">
                <!-- แถบเครื่องมือควบคุมด้านข้าง (Side Toolbar) -->
                <div class="side-toolbar">
                    <button class="tool-btn" title="Home" onclick="goHome()">🏠</button>
                    <button class="tool-btn" title="Back" onclick="appBack()">◀</button>
                    <button class="tool-btn" title="Tasks" onclick="showRecents()">◼</button>
                    <hr class="divider">
                    <label for="apkInput" class="tool-btn" title="Install APK">📥<input type="file" id="apkInput" accept=".apk" style="display: none;" onchange="installApk(event)"></label>
                    <button class="tool-btn" title="Restart Instance" onclick="restartDevice()">🔄</button>
                    <button class="tool-btn" title="Settings" onclick="openDeviceSettings()">⚙️</button>
                </div>

                <!-- พื้นที่แสดงผลหน้าจอโทรศัพท์ (Device Display Window) -->
                <div class="phone-container">
                    <div class="device-header">
                        <span id="deviceTitle">Cloud Instance #1</span>
                        <span id="deviceStatus" class="status-online">● Running</span>
                    </div>

                    <div class="phone-screen">
                        <!-- แถบ Status Bar ของ Android -->
                        <div class="android-status-bar">
                            <span id="clockDisplay">12:00</span>
                            <span>📶 5G &nbsp; 🔋 100%</span>
                        </div>

                        <!-- พื้นที่ในหน้าจอแอปพลิเคชัน -->
                        <div id="appDisplay" class="screen-viewport">
                            <!-- แสดงไอคอนแอปภายใน -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
