name: Deploy Real Redroid Cloud Phone

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # ปุ่มกดสั่งรันเองด้วยมือจากหน้า GitHub Actions

jobs:
  deploy-redroid:
    name: Deploy & Run Redroid Container
    runs-on: self-hosted # รันบน Self-hosted Runner (เครื่อง VPS/Server ที่มี KVM)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Android Kernel Modules
        run: |
          echo "Loading Binder & Ashmem modules..."
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true

      - name: Stop and Remove Old Container
        run: |
          echo "Cleaning up existing containers..."
          docker stop redroid-pixel7 || true
          docker rm redroid-pixel7 || true

      - name: Launch Redroid (Pixel 7 Pro Hardware Spoofing)
        run: |
          docker run -d \
            --name redroid-pixel7 \
            --privileged \
            --pull always \
            -v /data/redroid:/data \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=420 \
            androidboot.hardware=cheetah \
            ro.product.model="Pixel 7 Pro" \
            ro.product.brand="google" \
            ro.product.name="cheetah" \
            ro.product.device="cheetah" \
            ro.product.manufacturer="Google" \
            ro.build.fingerprint="google/cheetah/cheetah:13/TQ3A.230901.001/10750789:user/release-keys" \
            ro.build.version.release=13 \
            ro.build.version.sdk=33 \
            ro.kernel.qemu=0 \
            ro.boot.hardware=cheetah

      - name: Verify Container Status
        run: |
          sleep 8
          docker ps | grep redroid-pixel7
          echo "Redroid Cloud Phone deployed successfully on port 5555!"
