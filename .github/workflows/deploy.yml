name: Deploy BlueFinger Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: อัปเดตหน้าเว็บ GitHub Pages อัตโนมัติ
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  # Job 2: เตรียมความพร้อมสำหรับรัน Android Container (Scale-to-Zero)
  start-android-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Android Container
        run: |
          docker build -t bluefinger-android .
          echo "BlueFinger Cloud Android Engine Ready!"
